{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" type="text/css" href="static/fragancia/css/fragancia.css"/>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link href="{% static 'fragancia/img/logo/logo.png' %}" type="text/css" rel="icon">
    <title>Fragancia/Habana - Login</title>
    <link href="{% static 'fragancia/vendor/fontawesome-free/css/all.min.css' %}" type="text/css" rel="stylesheet"
          type="text/css">
    <link href="{% static 'fragancia/vendor/bootstrap/css/bootstrap.min.css' %}" type="text/css" rel="stylesheet"
          type="text/css">
    <link href="{% static 'fragancia/css/ruang-admin.min.css' %}" type="text/css" rel="stylesheet">

</head>

<body class="bg-gradient-login">
<!-- Login Content -->
<div class="card-body">
    <div class="row justify-content-center">
        <div class="col-xl-4 col-lg-6 col-md-3">
            <div class="card mb-8">
                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-center">
                    <h6 id="titulo_tablas_formularios"
                        class="m-0 font-weight-bold text-secondary">Inicio de Sesión</h6>
                </div>

                <div class="text-center">
                    <img style="width: 160px;height: auto;" src="{% static 'fragancia/img/login.PNG' %}"/>
                </div>
                <div class="card-body">
                    <form role="form" method="post" class="user">{% csrf_token %}
                        <div class="form-group row">
                            <label for="inputEmail3" class="col-sm-4 col-form-label">Usuario <strong>*</strong> </label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="exampleInputUser" name="username"
                                       aria-describedby="textHelp"
                                       placeholder="Usuario">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="inputEmail3" class="col-sm-4 col-form-label">Contraseña <strong>*</strong>
                            </label>
                            <div class="col-sm-8">
                                <input type="password" class="form-control" id="exampleInputPassword"
                                       name="password"
                                       placeholder="Contraseña">
                            </div>
                        </div>
{#                        <div class="form-group row">#}
{#                            <div class="col-sm-4 col-form-label">#}
{#                                <div class="custom-control custom-checkbox small" style="line-height: 1.5rem;">#}
{#                                    <input type="checkbox" class="custom-control-input" id="customCheck">#}
{#                                    <label class="custom-control-label" for="customCheck">Recordarme</label>#}
{#                                </div>#}
{#                            </div>#}
{#                        </div>#}
                        <div class="form-group row" style="padding:0.5em 0.5em 0 0.5em">
                            <button type="submit" id="boton_formularios" class="btn btn-primary btn-block">Entrar</button>
                        </div>
                        <hr>
                        {% if messages %}
                            <ul class="messages">
                                {% for message in messages %}
                                    <div class="alert {% if message.tags %}alert-danger{% endif %}"
                                         role="alert">{{ message }}</div>
                                {% endfor %}
                            </ul>
                        {% endif %}
                    </form>
                </div>


            </div>

        </div>
    </div>
</div>

<!-- Login Content -->
<script src="{% static 'fragancia/vendor/jquery/jquery.min.js' %}"></script>
<script src="{% static 'fragancia/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'fragancia/vendor/jquery-easing/jquery.easing.min.js' %}"></script>
<script src="{% static 'fragancia/js/ruang-admin.min.js' %}"></script>
</body>

</html>
