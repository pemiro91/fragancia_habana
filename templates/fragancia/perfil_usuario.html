{% extends "fragancia/base.html" %}
{% load static %}
{% block header_style %}
    <link href="{% static 'fragancia/img/logo/logo.png' %}" rel="icon">
    <link href="{% static 'fragancia/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'fragancia/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'fragancia/css/ruang-admin.min.css' %}" rel="stylesheet">
    <link href="{% static 'fragancia/vendor/datatables/dataTables.bootstrap4.min.css' %}" rel="stylesheet">
{% endblock %}

{% block header_content %}
    <h1 class="h3 mb-0 text-gray-800">Perfil de Usuario</h1>
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'index' %}">Tableros de Control</a></li>
        <li class="breadcrumb-item active" ><a href="{% url 'index' %}">Usuarios</a></li>
        <li class="breadcrumb-item active" aria-current="page">Perfil de Usuario</li>
    </ol>
{% endblock %}
{% block content %}
    <div class="col-lg-12">
        <div class="card mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
            </div>
            <div class="col-lg-8 order-lg-2">
                <div class="tab-content py-4">

                    <div class="tab-pane active" id="edit">
                        <form role="form" method="post">
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">First name</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="text" value="{{ request.user.first_name }}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Last name</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="text" value="{{ request.user.last_name }}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Email</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="email" value="{{ request.user.email }}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Company</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="text" value="{{ request.user.telefono }}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Website</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="url" value="">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Address</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="text" value="" placeholder="Street">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label"></label>
                                <div class="col-lg-6">
                                    <input class="form-control" type="text" value="" placeholder="City">
                                </div>
                                <div class="col-lg-3">
                                    <input class="form-control" type="text" value="" placeholder="State">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Time Zone</label>
                                <div class="col-lg-9">
                                    <select id="user_time_zone" class="form-control" size="0">
                                        <option value="Hawaii">(GMT-10:00) Hawaii</option>
                                        <option value="Alaska">(GMT-09:00) Alaska</option>
                                        <option value="Pacific Time (US &amp; Canada)">(GMT-08:00) Pacific Time
                                            (US &amp; Canada)
                                        </option>
                                        <option value="Arizona">(GMT-07:00) Arizona</option>
                                        <option value="Mountain Time (US &amp; Canada)">(GMT-07:00) Mountain
                                            Time (US &amp; Canada)
                                        </option>
                                        <option value="Central Time (US &amp; Canada)" selected="selected">
                                            (GMT-06:00) Central Time (US &amp; Canada)
                                        </option>
                                        <option value="Eastern Time (US &amp; Canada)">(GMT-05:00) Eastern Time
                                            (US &amp; Canada)
                                        </option>
                                        <option value="Indiana (East)">(GMT-05:00) Indiana (East)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Username</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="text" value="janeuser">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Password</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="password" value="11111122333">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label">Confirm
                                    password</label>
                                <div class="col-lg-9">
                                    <input class="form-control" type="password" value="11111122333">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-3 col-form-label form-control-label"></label>
                                <div class="col-lg-9">
                                    <input type="reset" class="btn btn-secondary" value="Cancelar">
                                    <input type="button" class="btn btn-primary" value="Guardar Cambios">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>


        </div>
    </div>

{% endblock %}

{% block plugin_section %}
    <!-- Page level plugins -->
    <script src="{% static 'fragancia/vendor/datatables/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'fragancia/vendor/datatables/dataTables.bootstrap4.min.css' %}"></script>
    <!-- Page level custom scripts -->

{% endblock %}
